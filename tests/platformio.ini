; Host tests for components/omron. The canonical runner is
; ./run_protocol_tests.sh, which is what CI invokes; this environment exists so
; `pio test -e native` also works from the tests/ directory.
;
; The suite is plain assert() with its own main(), hence test_framework =
; custom. Both runners select sources by excluding the files that need esphome
; headers, so a new pure source file is picked up by both without being listed
; anywhere. Keep that exclusion list and the standard below in step with
; run_protocol_tests.sh, which is what CI runs.

[platformio]
test_dir = .
src_dir = ../components/omron

[env:native]
platform = native
test_framework = custom
test_build_src = yes
build_flags =
    -std=gnu++20
    -Wall
    -Wextra
    -Werror
    -I ../components/omron
build_src_filter =
    +<*.cpp>
    -<omron_ble_client.cpp>
    -<omron_ble_client_bond.cpp>
    -<omron_entities.cpp>
