name: tests
on:
  push:
    branches: [main]
    paths: ["components/omron/**", "tests/**", ".github/**", ".intellisense.yaml", "pyproject.toml", ".pre-commit-config.yaml", ".clang-format", ".clang-tidy"]
  pull_request:
    paths: ["components/omron/**", "tests/**", ".github/**", ".intellisense.yaml", "pyproject.toml", ".pre-commit-config.yaml", ".clang-format", ".clang-tidy"]
permissions:
  contents: read
env:
  ESPHOME_VERSION: "2026.8.1"
  ESPHOME_FLOOR: "2026.5.1"
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: ruff + pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Cache pre-commit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: ${{ runner.os }}-pre-commit-
      - name: Install pre-commit
        run: pip install "pre-commit==4.6.0"
      - name: Run pre-commit (ruff lint + format + hygiene)
        run: pre-commit run --all-files --show-diff-on-failure
  unit-tests:
    name: protocol unit tests (native)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      # The runner builds with g++ and -Werror, so a missing confidence field on
      # a new profile fails here rather than shipping unlabelled.
      - name: Run protocol unit tests
        run: |
          set -euo pipefail
          bash tests/run_protocol_tests.sh | tee test-output.txt
          # rc=0 without the closing line means the binary stopped early.
          grep -q '^ok: [0-9]\+ test groups passed$' test-output.txt
  esphome-build:
    name: esphome compile (${{ matrix.arch }})
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Both instruction sets and three radios. The component is written
        # against Bluedroid rather than anything xtensa, so a riscv part
        # breaking would be a surprise - which is the reason to build one.
        include:
          - arch: xtensa
            boards: esp32dev esp32-s3-devkitc-1
          - arch: riscv
            boards: esp32-c3-devkitm-1 esp32-c6-devkitc-1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: ${{ runner.os }}-idf-${{ env.ESPHOME_VERSION }}-${{ matrix.arch }}
          restore-keys: ${{ runner.os }}-idf-${{ env.ESPHOME_VERSION }}-
      - name: Install ESPHome
        run: pip install "esphome==${{ env.ESPHOME_VERSION }}"
      - name: Compile every board, failing on any warning from the component
        run: |
          set -euo pipefail
          for board in ${{ matrix.boards }}; do
            bash tests/check_esp32_warnings.sh .github/ci-build.yaml "$board"
          done
  config-build-floor:
    name: config check and build at the ESPHome floor
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
      - name: Cache PlatformIO
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9  # v6.1.0
        with:
          path: |
            ~/.platformio
            ~/.cache/esphome
          key: ${{ runner.os }}-idf-${{ env.ESPHOME_FLOOR }}-xtensa
          restore-keys: ${{ runner.os }}-idf-${{ env.ESPHOME_FLOOR }}-
      - name: Install ESPHome (component floor)
        run: pip install "esphome==${{ env.ESPHOME_FLOOR }}"
      - name: Validate CI and IntelliSense configs
        run: |
          set -euo pipefail
          esphome config .github/ci-build.yaml
          esphome config .intellisense.yaml
      # A compile, not a config check. Validation only exercises the Python
      # layer, and every version constraint this component actually has is in
      # the C++: it subclasses BLEClientBase and overrides hooks that arrived in
      # particular releases. A floor checked by `esphome config` alone reads as
      # verified while being wrong by several releases.
      - name: Compile at the floor
        run: esphome compile .github/ci-build.yaml
