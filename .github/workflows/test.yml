name: tests
on:
  push:
    branches: [main]
    paths: ["components/omron/**", "tests/**", ".github/**", ".intellisense.yaml", "pyproject.toml", ".pre-commit-config.yaml", ".clang-format"]
  pull_request:
    paths: ["components/omron/**", "tests/**", ".github/**", ".intellisense.yaml", "pyproject.toml", ".pre-commit-config.yaml", ".clang-format"]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  lint:
    name: ruff + pre-commit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"
      - name: Cache pre-commit
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/pre-commit
          key: ${{ runner.os }}-pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
          restore-keys: ${{ runner.os }}-pre-commit-
      - name: Install pre-commit
        run: pip install "pre-commit==4.6.0"
      - name: Run pre-commit (ruff lint + format + hygiene)
        run: pre-commit run --all-files --show-diff-on-failure
  unit-tests:
    name: protocol unit tests (native)
    needs: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      # The runner builds with g++ and -Werror, so a missing confidence field on
      # a new profile fails here rather than shipping unlabelled.
      - name: Run protocol unit tests
        run: |
          set -euo pipefail
          bash tests/run_protocol_tests.sh | tee test-output.txt
          # rc=0 without the closing line means the binary stopped early.
          grep -q '^ok: [0-9]\+ test groups passed$' test-output.txt
  esphome-build:
    name: esphome compile (${{ matrix.board }})
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Both instruction sets and three radios. The component is written
        # against Bluedroid rather than anything xtensa, so a riscv part
        # breaking would be a surprise - which is the reason to build one.
        board:
          - esp32dev
          - esp32-s3-devkitc-1
          - esp32-c3-devkitm-1
          - esp32-c6-devkitc-1
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"
      - name: Cache PlatformIO
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.platformio
          # Keyed on the board as well: these entries hold a whole toolchain
          # each, and two targets sharing one key evict each other every run.
          key: ${{ runner.os }}-esphome-${{ matrix.board }}-${{ hashFiles('.github/ci-build.yaml') }}
          restore-keys: ${{ runner.os }}-esphome-${{ matrix.board }}-
      - name: Install ESPHome
        run: pip install "esphome==2026.8.0"
      - name: Compile full component
        run: |
          set -euo pipefail
          esphome -s board ${{ matrix.board }} compile .github/ci-build.yaml
  build-floor:
    name: esphome compile at the declared floor
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: "3.14"
      - name: Cache PlatformIO
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.platformio
          key: ${{ runner.os }}-esphome-floor-${{ hashFiles('.github/ci-build.yaml') }}
          restore-keys: ${{ runner.os }}-esphome-floor-
      # Pinned to min_version, so the floor is a compiled claim rather than a
      # number in a yaml.
      - name: Install ESPHome (component floor)
        run: pip install "esphome==2026.5.1"
      # A compile, not a config check. Validation only exercises the Python
      # layer, and every version constraint this component actually has is in
      # the C++: it subclasses BLEClientBase and overrides hooks that arrived in
      # particular releases. A floor checked by `esphome config` alone reads as
      # verified while being wrong by several releases.
      - name: Compile at the floor
        run: |
          set -euo pipefail
          esphome config .intellisense.yaml
          esphome compile .github/ci-build.yaml
